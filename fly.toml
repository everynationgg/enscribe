app = "enscribe-game"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when no connections — zero free-tier hours wasted
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
